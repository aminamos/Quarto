# Quarto — cloud build + TestFlight upload
#
# Trigger manually from anywhere: GitHub.com > aminamos/Quarto > Actions >
# "TestFlight" > Run workflow. (The GitHub mobile app works too.)
#
# One-time setup (5 minutes, all in a browser):
#   1. App Store Connect > Users and Access > Integrations > App Store Connect API
#      > Team Keys > "+" — name it "Quarto CI" and give it the **Admin** role.
#      Download the .p8 (shown ONCE) and note the Key ID + Issuer ID.
#      Admin is required for the distribution half of the build: "Export IPA"
#      needs an Apple Distribution certificate plus an App Store provisioning
#      profile for codes.amos.quarto, and only the Admin role carries
#      Certificates, Identifiers & Profiles access. App Manager / Developer keys
#      can mint development assets (that is how the archive gets signed) but the
#      export then stops with `error: exportArchive Cloud signing permission
#      error` / `No profiles for 'codes.amos.quarto' were found`.
#      An API key's access level can't be edited after creation, so revoke the
#      old key and generate a new one with the Admin role.
#   2. Make sure the app record exists: App Store Connect > My Apps > Quarto
#      (bundle ID codes.amos.quarto). If missing: "+" > New App > iOS.
#   3. GitHub repo > Settings > Secrets and variables > Actions > New repository secret:
#        ASC_KEY_ID     = Key ID from step 1
#        ASC_ISSUER_ID  = Issuer ID from step 1
#        ASC_KEY_P8     = full contents of the .p8 file (-----BEGIN/END----- lines included)
#   4. Push this file. Done — no Xcode needed ever again for a build.
#
# Alternative if the key must stay App Manager: sign manually. Create the Apple
# Distribution certificate and the App Store profile by hand, export the .p12
# and the .mobileprovision, store them as repository secrets, import them into a
# temporary keychain below, and set `signingStyle` to `manual` (with
# `provisioningProfiles`) in exportOptions.plist.
#
# How it works: xcodegen regenerates the project from project.yml, xcodebuild
# archives with automatic signing (authenticating to Apple with the API key),
# exports an App Store IPA, and uploads it to TestFlight. The Rust core ships
# prebuilt as Frameworks/QuartoAdSkip.xcframework (committed), so CI never
# builds Rust. Build number = the workflow run number (always increasing).

name: TestFlight

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Tester notes for this build (shown in TestFlight)"
        required: false
        default: ""

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 16+
        run: |
          BEST=""; BEST_V=""
          for app in /Applications/Xcode_16*.app /Applications/Xcode_2*.app; do
            [ -d "$app" ] || continue
            v="$(basename "$app" .app | sed 's/^Xcode_//')"
            if [ -z "$BEST" ] || [ "$(printf '%s\n%s\n' "$BEST_V" "$v" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)" = "$v" ]; then
              BEST="$app"; BEST_V="$v"
            fi
          done
          test -n "$BEST" || { echo "No Xcode 16+ found"; exit 1; }
          echo "Using $BEST"
          sudo xcode-select -s "$BEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devs = json.load(sys.stdin)['devices']
          for rt in sorted(devs, reverse=True):
              for d in devs[rt]:
                  if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                      print(d['udid']); raise SystemExit
          ")"
          test -n "$UDID" || { echo "No iPhone simulator available"; exit 1; }
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run tests
        run: >
          xcodebuild test
          -project Quarto.xcodeproj
          -scheme Quarto
          -destination "platform=iOS Simulator,id=${{ env.SIM_UDID }}"

  testflight:
    name: Archive and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 16+
        run: |
          BEST=""; BEST_V=""
          for app in /Applications/Xcode_16*.app /Applications/Xcode_2*.app; do
            [ -d "$app" ] || continue
            v="$(basename "$app" .app | sed 's/^Xcode_//')"
            if [ -z "$BEST" ] || [ "$(printf '%s\n%s\n' "$BEST_V" "$v" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)" = "$v" ]; then
              BEST="$app"; BEST_V="$v"
            fi
          done
          test -n "$BEST" || { echo "No Xcode 16+ found"; exit 1; }
          echo "Using $BEST"
          sudo xcode-select -s "$BEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Check App Store Connect credentials
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 are present."

      - name: Stage App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          KEY_PATH="$RUNNER_TEMP/asc/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive for App Store
        run: >
          xcodebuild archive
          -project Quarto.xcodeproj
          -scheme Quarto
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Quarto.xcarchive"
          -authenticationKeyPath "$ASC_KEY_PATH"
          -authenticationKeyID "${{ secrets.ASC_KEY_ID }}"
          -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
          -allowProvisioningUpdates
          CODE_SIGN_STYLE=Automatic
          CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export IPA
        run: >
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/Quarto.xcarchive"
          -exportPath "$RUNNER_TEMP/export"
          -exportOptionsPlist exportOptions.plist
          -authenticationKeyPath "$ASC_KEY_PATH"
          -authenticationKeyID "${{ secrets.ASC_KEY_ID }}"
          -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
          -allowProvisioningUpdates

      - name: Verify the IPA
        run: |
          test -f "$RUNNER_TEMP/export/Quarto.ipa" || {
            echo "::error::export finished without producing Quarto.ipa"
            exit 1
          }
          ls -l "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/export/Quarto.ipa
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_KEY_P8 }}
          release-notes: ${{ inputs.release_notes }}
          uses-non-exempt-encryption: 'false'
          wait-for-processing: 'true'
