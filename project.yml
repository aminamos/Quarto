name: Quarto
options:
  bundleIdPrefix: codes.amos
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: 2BN99U32MZ
packages:
  sherpa-onnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    version: 1.13.8
targets:
  Quarto:
    type: application
    platform: iOS
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
          - Models/parakeet-ultra
      - path: Sources/Models/parakeet-ultra
        buildPhase: resources
        type: folder
        optional: true
    preBuildScripts:
      - name: Fix onnxruntime minimum OS version
        script: |
          # onnxruntime-libs 1.28.2 declares MinimumOSVersion 13.0 while its
          # binary requires 18.0 (Apple ITMS-90208 rejects the upload).
          # Patch the SPM artifacts before Xcode embeds and signs them.
          ARTIFACTS=$(cd "$BUILD_DIR/../../SourcePackages/artifacts" 2>/dev/null && pwd)
          if [ -z "$ARTIFACTS" ]; then
            echo "error: SourcePackages artifacts dir not found" >&2
            exit 1
          fi
          COUNT=$(find "$ARTIFACTS" -path "*onnxruntime.framework/Info.plist" | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "error: no onnxruntime.framework Info.plist found under $ARTIFACTS" >&2
            exit 1
          fi
          find "$ARTIFACTS" -path "*onnxruntime.framework/Info.plist" \
            -exec /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 18.0" {} \;
          echo "patched $COUNT onnxruntime Info.plist(s) to MinimumOSVersion 18.0"
    dependencies:
      - framework: Frameworks/QuartoAdSkip.xcframework
        embed: false
      - package: sherpa-onnx
        product: sherpa-onnx
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Quarto
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Quarto connects to your self-hosted Audiobookshelf server on your local network or VPN."
        NSSpeechRecognitionUsageDescription: "Quarto uses on-device speech recognition to detect sponsor breaks and ad segments."
        NSMicrophoneUsageDescription: "Quarto uses audio recognition to detect sponsor breaks."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: codes.amos.quarto
        PRODUCT_NAME: Quarto
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_TESTABILITY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - QuartoTests
  QuartoTests:
    type: bundle.unit-test
    platform: iOS
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: Tests/QuartoTests
    dependencies:
      - target: Quarto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: codes.amos.quarto.tests
